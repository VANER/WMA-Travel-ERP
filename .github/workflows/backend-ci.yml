name: Backend CI

on:
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WMA_DATABASE_URL: postgresql+psycopg://wma_test@localhost:5432/wma_phase2_test
      WMA_TEST_DATABASE_URL: postgresql+psycopg://wma_test@localhost:5432/wma_phase2_test
      WMA_TOKEN_SIGNING_KEY: ci-only-signing-key-with-at-least-32-bytes
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wma_phase2_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: wma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wma_test -d wma_phase2_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Backend/pyproject.toml
            Backend/pylock.linux.toml

      - name: Instalar dependências
        run: |
          python -m pip install -r pylock.linux.toml
          python -m pip install --no-deps -e .

      - name: Verificar dependências
        run: python -m pip check

      - name: Executar lint
        run: ruff check .

      - name: Verificar formatação
        run: ruff format --check app tests migrations scripts

      - name: Verificar tipos
        run: mypy app tests scripts

      - name: Executar testes rápidos e integração PostgreSQL
        run: pytest -W error --run-postgresql --cov=app --cov-report=term-missing

      - name: Verificar contrato OpenAPI versionado
        run: python scripts/export_openapi.py --check

      - name: Classificar compatibilidade do contrato OpenAPI
        if: github.event_name == 'pull_request'
        env:
          WMA_OPENAPI_BASE_REF: origin/${{ github.base_ref }}
        run: python scripts/check_openapi_compatibility.py --base-ref "$WMA_OPENAPI_BASE_REF"

      - name: Verificar árvore de migrations
        run: alembic heads

      - name: Restaurar baseline certificada
        run: |
          createuser --host localhost --username wma_test postgres
          psql postgresql://wma_test@localhost:5432/wma_phase2_test -v ON_ERROR_STOP=1 -f ../Database/scripts/WmaTravelERP.sql

      - name: Aplicar migrations no PostgreSQL descartável
        run: alembic upgrade head

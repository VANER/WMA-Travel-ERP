name: Backend CI

on:
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13
    runs-on: ubuntu-latest
    env:
      WMA_DATABASE_URL: postgresql+psycopg://wma_test@localhost:5432/wma_test
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Backend/pyproject.toml
            Backend/pylock.linux.toml

      - name: Instalar dependências
        run: |
          python -m pip install -r pylock.linux.toml
          python -m pip install --no-deps -e .

      - name: Verificar dependências
        run: python -m pip check

      - name: Executar lint
        run: ruff check .

      - name: Verificar tipos
        run: mypy app tests

      - name: Executar testes
        run: pytest -W error --cov=app --cov-report=term-missing

      - name: Verificar árvore de migrations
        run: alembic heads
